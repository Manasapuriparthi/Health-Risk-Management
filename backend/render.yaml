services:
  - type: web
    name: vitalpredict-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: health_risk_db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

