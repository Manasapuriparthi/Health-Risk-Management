name: Appium Android E2E Tests — Mobile Application

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  appium-android-e2e:
    name: Appium E2E on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # ── Stage 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Stage 2: Setup Java 17 ─────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Stage 3: Setup Node.js 20 ──────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Stage 4: Setup Python 3.11 ─────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Stage 5: Start FastAPI Backend ────────────────────────────────────
      - name: Start FastAPI Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
          sleep 8
          curl -f http://localhost:8000/api/health || (cat ../backend.log && exit 1)
          echo "✅ Backend started"
        working-directory: backend

      # ── Stage 6: Setup Flutter & Build Debug APK ───────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get
        working-directory: mobile

      - name: Build Debug APK
        run: flutter build apk --debug
        working-directory: mobile

      # ── Stage 7: Setup Appium Server ───────────────────────────────────────
      - name: Install Appium Server
        run: |
          npm install -g appium@2.5.4
          appium driver install uiautomator2
          echo "✅ Appium installed"

      - name: Start Appium Server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log appium-server.log > appium-server.out 2>&1 &
          sleep 8
          curl -f http://localhost:4723/status || echo "Appium status check warning"
          echo "✅ Appium server started"

      - name: Install Appium Test Dependencies
        run: npm install
        working-directory: testing/appium

      # ── Stage 8: Run Appium Tests on Hardware Accelerated Android Emulator ──
      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "mobile/build/app/outputs/flutter-apk/app-debug.apk"
            cd testing/appium
            npm run test:auth || true
            npm run test:regression || true

      # ── Stage 9: Generate Reports ──────────────────────────────────────────
      - name: Generate Appium Reports
        if: always()
        run: node utils/appiumReportGenerator.js
        working-directory: testing/appium
        continue-on-error: true

      # ── Stage 10: Capture Device Logs ──────────────────────────────────────
      - name: Capture Device Logs
        if: always()
        run: |
          mkdir -p testing/appium/logs
          adb logcat -d > "testing/appium/logs/device.log" 2>&1 || true
          cat appium-server.log > "testing/appium/logs/appium.log" 2>&1 || true

      # ── Stage 11: Upload Artifacts ─────────────────────────────────────────
      - name: Upload Appium Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-reports-${{ github.run_number }}
          retention-days: 30
          path: |
            testing/appium/reports/
            testing/appium/screenshots/
            testing/appium/logs/

      # ── Stage 12: Deploy Reports to GitHub Pages ───────────────────────────
      - name: Deploy Appium Reports to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: testing/appium/reports/HTML
          destination_dir: reports/appium/latest
          keep_files: true

      # ── Stage 13: GitHub Actions Summary ──────────────────────────────────
      - name: Publish GitHub Actions Summary
        if: always()
        run: |
          SUMMARY="testing/appium/reports/Summary/appium-summary.md"
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY; fi
          echo "**Build:** ${{ github.run_number }} | **Platform:** Android Emulator API 29" >> $GITHUB_STEP_SUMMARY
