name: Selenium E2E Tests — Web Application

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: false
        default: 'staging'
  schedule:
    - cron: '0 2 * * *'   # Daily at 2 AM

env:
  BASE_URL: ${{ vars.BASE_URL || 'http://localhost:5173' }}
  API_BASE: ${{ vars.API_BASE || 'http://localhost:8000/api' }}
  BUILD_NUMBER: ${{ github.run_number }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'ci' }}
  APP_VERSION: '1.0.0'
  HEADLESS: 'true'

jobs:
  selenium-e2e:
    name: Run Selenium E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Stage 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Stage 2: Setup Node.js ─────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: testing/selenium/package-lock.json

      # ── Stage 3: Setup Python (Backend) ───────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Stage 4: Setup Chrome ──────────────────────────────────────────────
      - name: Setup Chrome Browser
        uses: browser-actions/setup-chrome@latest

      - name: Verify Chrome Version
        run: google-chrome --version

      # ── Stage 5: Install Backend Dependencies ────────────────────────────
      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ── Stage 6: Start MongoDB ─────────────────────────────────────────────
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '7.0'

      # ── Stage 7: Start Backend Server ─────────────────────────────────────
      - name: Start FastAPI Backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          curl -f http://localhost:8000/api/health || exit 1
          echo "✅ Backend is healthy"
        working-directory: backend

      # ── Stage 8: Install Frontend Dependencies ────────────────────────────
      - name: Install Frontend Dependencies
        run: npm install
        working-directory: frontend

      # ── Stage 9: Build & Start Frontend ───────────────────────────────────
      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      - name: Start Frontend Preview
        run: |
          npx vite preview --port 5173 --host 0.0.0.0 &
          sleep 5
          curl -f http://localhost:5173 || echo "Frontend not ready, tests may fail"
        working-directory: frontend

      # ── Stage 10: Install Selenium Dependencies ───────────────────────────
      - name: Install Selenium Test Dependencies
        run: npm install
        working-directory: testing/selenium

      # ── Stage 11: Register Test User ──────────────────────────────────────
      - name: Seed Test User
        run: |
          curl -s -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"Test Patient","email":"testpatient@vitalpredict.com","password":"Test@12345","role":"patient"}' \
            || echo "User may already exist"

      # ── Stage 12: Run Selenium E2E Tests ──────────────────────────────────
      - name: Run Authentication Tests
        run: npm run test:auth
        working-directory: testing/selenium
        continue-on-error: true
        env:
          BASE_URL: 'http://localhost:5173'
          API_BASE: 'http://localhost:8000/api'
          HEADLESS: 'true'

      - name: Run Dashboard Tests
        run: npm run test:dashboard
        working-directory: testing/selenium
        continue-on-error: true
        env:
          BASE_URL: 'http://localhost:5173'
          API_BASE: 'http://localhost:8000/api'
          HEADLESS: 'true'

      - name: Run Appointments Tests
        run: npm run test:appointments
        working-directory: testing/selenium
        continue-on-error: true
        env:
          BASE_URL: 'http://localhost:5173'
          HEADLESS: 'true'

      - name: Run Forms & Validation Tests
        run: npm run test:forms
        working-directory: testing/selenium
        continue-on-error: true
        env:
          BASE_URL: 'http://localhost:5173'
          HEADLESS: 'true'

      - name: Run Regression Suite
        run: npx jest tests/regression.test.js --runInBand --forceExit
        working-directory: testing/selenium
        continue-on-error: true
        env:
          BASE_URL: 'http://localhost:5173'
          HEADLESS: 'true'

      # ── Stage 13: Generate Reports ────────────────────────────────────────
      - name: Generate Excel & HTML Reports
        if: always()
        run: node utils/reportGenerator.js && node utils/excelGenerator.js
        working-directory: testing/selenium
        continue-on-error: true

      # ── Stage 14: Upload Artifacts ────────────────────────────────────────
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports-${{ github.run_number }}
          retention-days: 30
          path: |
            testing/selenium/reports/
            testing/selenium/screenshots/
            testing/selenium/logs/

      # ── Stage 15: Publish GitHub Pages ────────────────────────────────────
      - name: Deploy Reports to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: testing/selenium/reports/HTML
          destination_dir: reports/selenium/latest
          keep_files: true

      # ── Stage 16: GitHub Actions Summary ──────────────────────────────────
      - name: Publish GitHub Actions Summary
        if: always()
        run: |
          SUMMARY_FILE="testing/selenium/reports/Summary/summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Summary not generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** ${{ github.run_number }} | **Commit:** ${{ github.sha }} | **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

